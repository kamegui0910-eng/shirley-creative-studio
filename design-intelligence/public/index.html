<!doctype html>
<html lang="zh-CN">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shirley Design Intelligence</title><link rel="stylesheet" href="/style.css"></head>
<body>
<header><p class="wordmark">SHIRLEY <span>STUDIO</span></p><h1>Design Intelligence</h1></header>
<main>
<form id="login"><label for="token">预览访问令牌</label><div class="controls"><input id="token" type="password" required autocomplete="off"><button>打开工作台</button></div></form>
<p id="status" role="status" aria-live="polite"></p>
<div id="workspace" hidden>
<section aria-labelledby="library-heading">
<h2 id="library-heading">组件库</h2>
<div class="controls"><label>风格<select id="style"></select></label><label>分类<select id="category"></select></label></div>
<div id="library"></div><button id="more" hidden>加载更多</button>
</section>
<section aria-labelledby="recipe-heading">
<h2 id="recipe-heading">设计配方</h2>
<div class="controls"><label>名称<input id="title" value="新设计" maxlength="120"></label><label>配色<input id="accent" type="color" value="#f6c3da"></label></div>
<div class="stage"><canvas id="canvas" width="640" height="480" aria-label="组件合成预览"></canvas></div>
<p class="hint">选择下方槽位后，从组件库替换。取消选择可继续添加。</p>
<div id="slots"></div>
<div class="controls"><button id="save">保存配方</button><label>配方 ID<input id="recipeId"></label><button id="load">恢复</button></div>
</section>
</div>
</main>
<script type="module" src="/app.mjs"></script>
</body></html>
