name: Design Intelligence
on:
  pull_request:
    paths:
      - design-intelligence/**
      - .github/workflows/design-intelligence.yml
  push:
    branches:
      - codex/design-intelligence-phase1
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: design-intelligence
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - run: node tools/build-rest-worker.mjs && node --check .local/design-worker.mjs
